<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة الكابتن - مبيعات الصالة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
        h2 { color: #ffc107; text-align: center; margin-bottom: 10px; }
        
        .captain-bar { background: #1e1e1e; padding: 12px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .captain-bar select { padding: 8px 12px; border-radius: 5px; background: #222; color: #ffc107; font-weight: bold; border: 1px solid #444; font-size: 15px; }

        .tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .table-btn { background: #28a745; color: #fff; border: 2px solid #28a745; border-radius: 8px; padding: 10px 5px; text-align: center; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .table-btn.busy { background: #dc3545; border-color: #dc3545; }
        .table-btn.selected { border-color: #ffc107; box-shadow: 0 0 10px #ffc107; transform: scale(1.05); }

        .dept-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; border-bottom: 1px solid #333; }
        .dept-btn { background: #222; color: #fff; border: 1px solid #444; padding: 8px 15px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-weight: bold; font-size: 13px; }
        .dept-btn.active { background: #ffc107; color: #000; border-color: #ffc107; }

        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 80px; }
        .item-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 10px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .item-name { font-size: 15px; font-weight: bold; margin-bottom: 5px; }
        .item-price { color: #28a745; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        
        .counter-controls { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-qty { background: #ffc107; color: #000; border: none; width: 32px; height: 32px; border-radius: 50%; font-weight: bold; font-size: 18px; cursor: pointer; }
        .qty-val { font-size: 15px; font-weight: bold; width: 20px; }

        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e1e1e; border-top: 2px solid #ffc107; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-send { background: #28a745; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>🍽️ شاشة الكابتن - مبيعات الصالة</h2>

    <div class="captain-bar">
        <span>الكابتن الحالي:</span>
        <select id="captainSelect" onchange="onCaptainChange()"></select>
    </div>

    <div style="color:#ffc107; font-weight:bold; margin-bottom:8px;">خريطة طاولات الصالة:</div>
    <div class="tables-grid" id="tablesContainer"></div>

    <div style="color:#ffc107; font-weight:bold; margin:15px 0 8px 0;">أقسام المنيو:</div>
    <div class="dept-bar" id="deptContainer"></div>

    <div class="items-grid" id="menuContainer"></div>

    <div class="cart-bar">
        <div>
            طاولة: <span id="lblTable" style="color:#ffc107; font-weight:bold;">1</span> | 
            الإجمالي: <span id="grandTotal" style="color:#28a745; font-weight:bold;">0.00 ج.م</span>
        </div>
        <button class="btn-send" onclick="sendOrder()">إرسال الطلب للمطبخ 🚀</button>
    </div>

    <script>
        let menuItems = [];
        let busyTables = {};
        let selectedTable = 1;
        let selectedDept = 'الكل';
        let orderCart = {};

        async function initCaptainScreen() {
            await fetchCaptains();
            await fetchBusyTables();
            renderTables();
            await loadMenu();
        }

        async function fetchCaptains() {
            try {
                const res = await fetch('/api/captains');
                const captains = await res.json();
                const sel = document.getElementById('captainSelect');
                sel.innerHTML = '';
                captains.forEach(c => {
                    sel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                });
            } catch (err) { console.error(err); }
        }

        async function fetchBusyTables() {
            try {
                const res = await fetch('/api/active-tables');
                const data = await res.json();
                busyTables = data.busy_tables || {};
                renderTables();
            } catch (err) { console.error(err); }
        }

        function renderTables() {
            const container = document.getElementById('tablesContainer');
            container.innerHTML = '';
            for (let i = 1; i <= 12; i++) {
                const busyInfo = busyTables[i];
                const isBusy = !!busyInfo;
                const isSelected = selectedTable === i;
                
                container.innerHTML += `
                    <div class="table-btn ${isBusy ? 'busy' : ''} ${isSelected ? 'selected' : ''}" onclick="selectTable(${i})">
                        طاولة ${i}
                        <div style="font-size:10px; font-weight:normal;">${isBusy ? busyInfo.captain_name : 'فارغة'}</div>
                    </div>
                `;
            }
        }

        function selectTable(tNum) {
            const currentCaptainId = parseInt(document.getElementById('captainSelect').value);
            const busyInfo = busyTables[tNum];

            if (busyInfo && parseInt(busyInfo.captain_id) !== currentCaptainId) {
                alert(`عفواً! هذه الطاولة محجوزة بواسطة (${busyInfo.captain_name}). لا يمكنك التعديل عليها.`);
                return;
            }

            selectedTable = tNum;
            document.getElementById('lblTable').innerText = tNum;
            renderTables();
        }

        function onCaptainChange() {
            fetchBusyTables();
        }

        async function loadMenu() {
            try {
                const res = await fetch('/api/items');
                menuItems = await res.json();
                
                const depts = ['الكل', ...new Set(menuItems.map(i => i.department || 'عام'))];
                const deptContainer = document.getElementById('deptContainer');
                deptContainer.innerHTML = '';
                depts.forEach(d => {
                    deptContainer.innerHTML += `
                        <div class="dept-btn ${d === selectedDept ? 'active' : ''}" onclick="filterDept('${d}')">${d}</div>
                    `;
                });

                renderFilteredItems();
            } catch (err) { console.error(err); }
        }

        function filterDept(deptName) {
            selectedDept = deptName;
            document.querySelectorAll('.dept-btn').forEach(b => {
                b.classList.toggle('active', b.innerText === deptName);
            });
            renderFilteredItems();
        }

        function renderFilteredItems() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';
            
            const filtered = selectedDept === 'الكل' ? menuItems : menuItems.filter(i => (i.department || 'عام') === selectedDept);

            filtered.forEach(item => {
                const currentQty = orderCart[item.id] ? orderCart[item.id].qty : 0;
                container.innerHTML += `
                    <div class="item-card">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">${parseFloat(item.price).toFixed(2)} ج.م</div>
                        <div class="counter-controls">
                            <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
                            <span class="qty-val" id="qty-${item.id}">${currentQty}</span>
                            <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function changeQty(itemId, delta) {
            const item = menuItems.find(i => i.id === itemId);
            if (!item) return;

            if (!orderCart[itemId]) {
                orderCart[itemId] = { id: item.id, name: item.name, price: item.price, qty: 0 };
            }

            orderCart[itemId].qty += delta;

            if (orderCart[itemId].qty <= 0) {
                delete orderCart[itemId];
                if(document.getElementById(`qty-${itemId}`)) document.getElementById(`qty-${itemId}`).innerText = 0;
            } else {
                if(document.getElementById(`qty-${itemId}`)) document.getElementById(`qty-${itemId}`).innerText = orderCart[itemId].qty;
            }

            let total = 0;
            Object.values(orderCart).forEach(i => total += i.price * i.qty);
            document.getElementById('grandTotal').innerText = total.toFixed(2) + ' ج.م';
        }

        async function sendOrder() {
            const itemsList = Object.values(orderCart);
            if (itemsList.length === 0) {
                alert('اختر صنفاً واحداً على الأقل!');
                return;
            }

            const sel = document.getElementById('captainSelect');
            const captainId = sel.value;
            const captainName = sel.options[sel.selectedIndex].text;

            try {
                const res = await fetch('/api/submit-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order_type: 'hall',
                        table_num: selectedTable,
                        captain_id: captainId,
                        captain_name: captainName,
                        items: itemsList
                    })
                });

                const data = await res.json();
                if (data.status === 'success') {
                    alert('تم إرسال طلب الصالة بنجاح!');
                    orderCart = {};
                    document.getElementById('grandTotal').innerText = '0.00 ج.م';
                    initCaptainScreen();
                } else { alert(data.message); }
            } catch (err) { alert('خطأ في الاتصال بالسيرفر'); }
        }

        // التحديث الآلي للطاولات كل 3 ثوانٍ
        setInterval(fetchBusyTables, 3000);
        window.onload = initCaptainScreen;
    </script>
</body>
</html>
